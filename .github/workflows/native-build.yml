name: Build StreamTV Native Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'public/**'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./android/gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: streamtv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Allow authorized HTTP media streams on iOS
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInMedia bool true" "$PLIST" || true
      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: streamtv-ios-unsigned
          path: build/ios/Build/Products/Release-iphoneos/App.app
